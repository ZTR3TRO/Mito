<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mito · Casa (solo dev)</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/style.css">
<style>
  /* Comparación: versión aprobada y nueva lado a lado. Los estilos del cuarto son los de la app (style.css). */
  body{ margin:0; }
  .panel{ background:var(--bg); color:var(--ink); padding:20px; }
  .panel h1{ font-size:20px; margin:0 0 4px; }
  .panel h2{ font-size:15px; margin:28px 0 10px; }
  .pair{ display:flex; gap:28px; align-items:flex-start; }
  .lbl{ font-size:11px; font-weight:800; color:var(--ink-faint); margin:0 0 6px; text-transform:uppercase; letter-spacing:.04em; }
  .house{ display:flex; }
  .approved .room{ border-radius:var(--radius); border:2px solid var(--line); box-shadow:var(--shadow-soft); }
  .approved-bar{ margin-top:10px; position:relative; height:62px; background:var(--card); border:2px solid var(--line); border-radius:18px; }
  .approved-bar .house-bar{ position:absolute; background:none; border:0; box-shadow:none; -webkit-backdrop-filter:none; backdrop-filter:none; bottom:4px; }
  .still .room *, .still .mascot, .still .mascot *{ animation:none !important; }

  /* Fase 2: los estados usan los estilos reales (style.css); aquí solo el acomodo de la página */
  .needs{ flex-wrap:wrap; }
  .sketch-speech{ left:50% !important; translate:-50% 0; top:22%; }
  .still .zzz i{ opacity:1; } .still .zzz i:nth-child(2){ transform:translate(.6em, -.9em); } .still .zzz i:nth-child(3){ transform:translate(1.2em, -1.9em); }

  /* ===== Fase 3 · BOCETOS de la comida (propuesta; si se aprueba, pasa a style.css) ===== */
  .food-sketch .pair{ gap:22px; }
  /* barra con 4 botones: en angosto, icono arriba y texto abajo (como una barra de pestañas) para que quepa en 360 px */
  .house-act.has-dot{ position:relative; }
  .house-act.has-dot::after{ content:''; position:absolute; top:5px; right:7px; width:9px; height:9px; border-radius:50%;
    background:var(--yellow); box-shadow:0 0 0 2px #fff; }
  @container house (max-width: 460px){
    .food-sketch .house-act, .decor-sketch .house-act{ flex-direction:column; gap:2px; padding:6px 6px 5px; font-size:11.5px; min-width:58px; justify-content:center; }
    .food-sketch .house-act svg, .decor-sketch .house-act svg{ width:19px; height:19px; }
    .food-sketch .house-bar, .decor-sketch .house-bar{ gap:5px; padding:5px; }
  }

  /* charola: mientras está abierta ocupa el lugar de la barra (no tapa a Mito ni a la mascota) */
  .house-bar.is-tray{ align-items:center; gap:8px; padding:6px; }
  .house-act.ft-close{ flex-direction:column; gap:2px; padding:7px 12px 6px; font-size:12px; flex:none;
    background:var(--card); color:var(--ink-dim); box-shadow:0 3px 0 0 var(--line); border:1.5px solid var(--line); }
  .house-act.ft-close svg{ width:18px; height:18px; }
  .ft-list{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:2px; min-width:0; scroll-snap-type:x proximity;
    -webkit-mask:linear-gradient(90deg, #000 calc(100% - 18px), transparent); mask:linear-gradient(90deg, #000 calc(100% - 18px), transparent); }
  .ft-item{ all:unset; position:relative; flex:none; width:64px; box-sizing:border-box; display:grid; justify-items:center; gap:1px;
    padding:6px 3px 5px; border-radius:14px; background:var(--card); border:2px solid var(--line); cursor:grab; touch-action:none; scroll-snap-align:start; }
  .ft-item:focus-visible{ outline:3px solid var(--lilac); outline-offset:2px; }
  .ft-art svg{ width:34px; height:34px; display:block; }
  .ft-count{ position:absolute; top:3px; right:3px; min-width:12px; padding:0 5px; border-radius:999px; text-align:center;
    font:800 10.5px/1.5 var(--font-body); color:#fff; background:linear-gradient(135deg,var(--pink),var(--lilac)); }
  .ft-name{ max-width:58px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:10px; font-weight:800; color:var(--ink-dim); }
  .ft-item.is-picked{ border-style:dashed; }
  .ft-item.is-picked .ft-art{ opacity:.3; }
  .ft-item.is-nope{ border-color:var(--pink); rotate:-5deg; }
  .ft-empty{ display:flex; align-items:center; gap:10px; padding:0 6px 0 2px; min-width:0; }
  .ft-empty > div{ display:grid; gap:1px; min-width:104px; }
  .ft-empty b{ font-size:12.5px; line-height:1.2; color:var(--ink); } .ft-empty span{ font-size:11px; font-weight:700; color:var(--ink-faint); }
  .ft-empty .btn-mini{ flex:none; padding:8px 11px; }
  .ft-plate{ width:38px; height:38px; border-radius:50%; border:3px dashed var(--line); flex:none; box-sizing:border-box; }
  @container house (max-width: 460px){ .ft-empty .ft-plate{ display:none; } .ft-empty span{ display:none; } }
  @container house (min-width: 641px){ .ft-item{ width:74px; } .ft-name{ max-width:70px; } }

  /* referencias dentro de la escena: la boca de Mito está a 0.193 de su ancho por encima de --home-y */
  .food-sketch .scene{ --mouth-y:calc(var(--home-y) - var(--mito) * .193); }
  .sk-ghost{ position:absolute; z-index:6; width:calc(var(--mito) * .34); left:calc(var(--home-x) + var(--mito) * .16); top:calc(var(--mouth-y) + var(--mito) * .03);
    translate:-50% -50%; rotate:-14deg; filter:drop-shadow(0 10px 10px rgba(51,39,74,.3)); pointer-events:none; }
  .sk-ghost svg, .sk-bite svg{ width:100%; height:auto; display:block; }
  .sk-target{ position:absolute; z-index:5; width:calc(var(--mito) * .34); aspect-ratio:1; left:var(--home-x); top:var(--mouth-y); translate:-50% -50%;
    border-radius:50%; border:2.5px dashed rgba(255,255,255,.9); background:rgba(255,93,162,.14); }
  .sk-bite{ position:absolute; z-index:6; width:calc(var(--mito) * .2); left:calc(var(--home-x) + var(--mito) * .03); top:calc(var(--mouth-y) + var(--mito) * .07);
    translate:-50% -50%; rotate:10deg;
    -webkit-mask:radial-gradient(circle at 18% 22%, transparent 0 21%, #000 22%); mask:radial-gradient(circle at 18% 22%, transparent 0 21%, #000 22%); }
  .sk-crumb{ position:absolute; z-index:6; width:6px; height:5px; border-radius:40%; background:#f7d9b0; box-shadow:0 0 0 1px #d9a873;
    left:calc(var(--home-x) + var(--mito) * var(--x)); top:calc(var(--mouth-y) + var(--mito) * var(--y)); }
  .sk-crumb.to-pet{ background:#ff8a9a; box-shadow:0 0 0 1px #d6435a; width:7px; height:7px; }
  .room.sk-pet-near .mascot > svg.pet{ translate:14% 0; }

  /* con hambre: nube de "pensando en comida" y la pancita que suena */
  .hunger-think{ position:absolute; z-index:6; left:calc(var(--home-x) + var(--mito) * .5); top:calc(var(--home-y) - var(--mito) * 1.12); pointer-events:none; }
  .hunger-think span{ display:grid; place-items:center; width:calc(var(--mito) * .3); aspect-ratio:1; border-radius:50%;
    background:var(--card); box-shadow:0 6px 14px -4px rgba(51,39,74,.3); border:2px solid var(--line); }
  .hunger-think span svg{ width:66%; height:66%; }
  .hunger-think i{ position:absolute; border-radius:50%; background:var(--card); border:2px solid var(--line); }
  .hunger-think i:nth-child(1){ width:8px; height:8px; left:-14px; top:calc(var(--mito) * .3 + 6px); }
  .hunger-think i:nth-child(2){ width:12px; height:12px; left:-4px; top:calc(var(--mito) * .3 - 6px); }
  .hunger-rumble{ inset:0; pointer-events:none; }
  .hunger-rumble i{ position:absolute; z-index:6; width:calc(var(--mito) * .07); height:calc(var(--mito) * .16); top:calc(var(--home-y) - var(--mito) * .36);
    border:3px solid transparent; border-left-color:color-mix(in srgb, var(--ink) 45%, transparent); border-radius:50%; }
  .hunger-rumble i:nth-child(1){ left:calc(var(--home-x) - var(--mito) * .6); }
  .hunger-rumble i:nth-child(2){ left:calc(var(--home-x) + var(--mito) * .53); rotate:180deg; }
  /* dato de nutrición: tarjeta arriba del cuarto por unos segundos */
  .food-fact{ position:absolute; z-index:9; top:14px; left:50%; translate:-50% 0; box-sizing:border-box; width:max-content; max-width:min(470px, calc(100% - 24px));
    display:flex; align-items:center; gap:10px; padding:9px 14px 9px 9px; border-radius:18px;
    background:color-mix(in srgb, var(--card) 94%, transparent); border:2px solid var(--mint); box-shadow:0 10px 24px -10px rgba(51,39,74,.4); }
  .food-fact .ff-art{ flex:none; width:40px; height:40px; border-radius:12px; background:var(--mint-pale); display:grid; place-items:center; }
  .food-fact .ff-art svg{ width:30px; height:30px; }
  .food-fact b{ display:block; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--mint-deep); }
  .food-fact span{ display:block; font-size:13px; font-weight:700; line-height:1.35; color:var(--ink); }
  [data-theme="dark"] .food-fact b{ color:var(--mint); }
  @container house (orientation: portrait) or (max-width: 640px){ .food-fact{ left:12px; right:12px; translate:none; max-width:none; width:auto; } }
  .sk-speech{ left:var(--home-x) !important; top:calc(var(--home-y) - var(--mito) * 1.0) !important; translate:-50% -100%; z-index:7; }
  .room .mascot .sk-pet-bubble{ right:auto; left:-66%; bottom:52%; max-width:104px; }

  /* Tienda · sección Comida */
  .sk-shop{ box-sizing:border-box; padding:26px 30px 30px; border:2px dashed var(--line); border-radius:22px; position:relative; }
  .sk-shop.is-mobile{ padding:18px 16px 230px; }
  .sk-shop.is-mobile .page-head{ flex-direction:column; align-items:flex-start; gap:10px; }
  .food-cat-sub{ display:block; margin-top:3px; font:700 12.5px/1.3 var(--font-body); color:var(--ink-dim); }
  .food-item{ position:relative; }
  .food-item .btn-mini{ white-space:nowrap; padding:8px 10px; }
  .sk-shop .page-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:18px; }
  .sk-shop .page-title{ font-size:30px; margin:0 0 6px; }
  .sk-shop .page-sub{ margin:0; max-width:520px; }
  .si-have{ position:absolute; top:8px; right:8px; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:800; color:#04352a; background:var(--mint); }
  .si-fill{ display:flex; align-items:center; justify-content:center; gap:6px; margin:-2px 0 9px; font-size:11.5px; font-weight:700; color:var(--ink-dim); }
  .si-fill i{ width:30px; height:6px; border-radius:6px; background:linear-gradient(90deg, var(--mint) var(--p), var(--line) 0); }
  .sk-more p{ color:var(--ink-faint); font-size:13px; margin:0; }
  .sk-trial{ display:grid; grid-template-columns:128px minmax(0,1fr) auto; grid-template-areas:"mito text close" "mito act act";
    column-gap:12px; row-gap:6px; align-items:center; position:absolute; left:12px; right:12px; bottom:14px; padding:10px;
    background:var(--card); border:2px solid var(--line); border-radius:24px; box-shadow:0 12px 28px -10px rgba(51,39,74,.38), var(--shadow-soft); }
  .sk-trial .tb-mito{ grid-area:mito; width:128px; height:100px; border-radius:20px; display:grid; place-items:center; box-sizing:border-box;
    background:linear-gradient(150deg, var(--mint-pale), var(--pink-pale)); border:2px solid var(--line); }
  .sk-trial .tb-food svg{ width:64px; height:64px; }
  .sk-trial .tb-text{ grid-area:text; display:flex; flex-direction:column; gap:2px; align-self:end; }
  .sk-trial .tb-name{ font-size:14px; font-weight:800; color:var(--ink); }
  .sk-trial .tb-sub{ font-size:11.5px; font-weight:700; color:var(--ink-faint); }
  .sk-trial .tb-act{ grid-area:act; justify-content:center; padding:10px 12px; font-size:13px; }
  .sk-trial .tb-close{ all:unset; grid-area:close; align-self:start; width:30px; height:30px; border-radius:999px; display:grid; place-items:center;
    font-size:22px; font-weight:900; color:var(--ink-faint); background:var(--pink-pale); border:2px solid var(--line); box-sizing:border-box; }

  /* ===== Fase 4 · BOCETOS de los muebles (propuesta; si se aprueba, pasa a style.css) ===== */
  /* capas: alfombras (sobre el piso, bajo la luz) · muebles (sobre la luz, bajo Mito). Dentro, el orden del DOM es la profundidad (por v). */
  .room-rugs, .room-furn{ inset:0; pointer-events:none; }
  .room-rugs{ z-index:1; } .room-furn{ z-index:3; }
  .furn{ position:absolute; }
  .furn-art{ display:block; width:100%; height:100%; }
  .furn-art svg{ width:100%; height:100%; display:block; overflow:visible; }
  .furn.is-flip .furn-art{ transform:scaleX(-1); }
  .furn-shadow{ display:none; }
  /* de noche (modo oscuro) se encienden lámpara y guirnalda; dormido, se apagan */
  .fx-glow{ opacity:0; transition:opacity .6s ease; }
  [data-theme="dark"] .room .fx-glow{ opacity:1; }
  [data-theme="dark"] .room.is-asleep .fx-glow{ opacity:0; }
  [data-theme="dark"] .furn-art{ filter:brightness(.9) saturate(.96); }
  /* Decorar */
  .house-act.dc-done{ background:linear-gradient(135deg, var(--mint), #5fd9b0); color:#04352a; border-color:transparent; box-shadow:0 3px 0 0 var(--mint-deep); }
  .dc-item{ cursor:pointer; touch-action:none; }
  .dc-item .ft-art svg{ width:46px; height:34px; }
  .dc-tag, .fi-tag{ font:800 9.5px/1 var(--font-body); letter-spacing:.04em; text-transform:uppercase; padding:2px 6px; border-radius:999px; }
  .dc-tag.wall, .fi-tag.wall{ color:#5b3aa6; background:#e8dcff; } .dc-tag.floor, .fi-tag.floor{ color:#0b6a4d; background:#c9f5e4; }
  [data-theme="dark"] .dc-tag.wall, [data-theme="dark"] .fi-tag.wall{ color:#e4d4ff; background:#4a3a73; } [data-theme="dark"] .dc-tag.floor, [data-theme="dark"] .fi-tag.floor{ color:#b9f5dd; background:#1d5a45; }
  .is-decorating .mascot{ pointer-events:none; }
  .furn.is-sel::before{ content:''; position:absolute; inset:-8px; border-radius:16px; border:2.5px dashed var(--lilac); background:rgba(185,138,246,.12); }
  .furn.is-lift{ z-index:6; transform:translateY(-4px) scale(1.07); filter:drop-shadow(0 16px 12px rgba(51,39,74,.32)); }
  .room-tools{ inset:0; z-index:8; pointer-events:none; }
  .dc-tools{ position:absolute; translate:-50% -100%; display:flex; gap:6px; pointer-events:auto; }
  .dc-tools button{ all:unset; display:inline-flex; align-items:center; gap:5px; padding:7px 11px; border-radius:999px; box-sizing:border-box; white-space:nowrap;
    font:800 12.5px/1 var(--font-body); color:var(--ink); background:var(--card); border:2px solid var(--line); box-shadow:0 3px 0 0 var(--line), 0 8px 16px -8px rgba(51,39,74,.35); }
  .dc-tools button svg{ width:16px; height:16px; } .dc-tools button:last-child{ color:#a02e6b; }
  [data-theme="dark"] .dc-tools button:last-child{ color:#ff9ac8; }
  .dc-zone{ position:absolute; z-index:2; pointer-events:none; border-radius:16px; border:2.5px dashed rgba(255,255,255,.7); box-sizing:border-box; }
  .dc-zone b{ position:absolute; left:10px; top:6px; font:800 10.5px/1 var(--font-body); letter-spacing:.05em; text-transform:uppercase; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.4); }
  .dc-zone.floor{ background:rgba(22,201,141,.18); border-color:#fff; } .dc-zone.wall{ background:rgba(0,0,0,.06); border-style:dotted; border-color:rgba(255,255,255,.45); }
  .dc-zone.floor.is-target{ box-shadow:inset 0 0 0 2px rgba(22,201,141,.55); }
  .house-bar.is-decor .dc-drop{ display:flex; align-items:center; gap:10px; padding:0 12px; height:100%; min-height:54px; color:var(--ink); border-radius:14px; border:2.5px dashed var(--pink); background:rgba(255,93,162,.1); }
  .house-bar.is-decor .dc-drop svg{ width:24px; height:24px; color:var(--pink); } .house-bar.is-decor .dc-drop b{ font-size:13.5px; }
  .house-bar.is-hot .ft-list{ flex:1; }
  /* Tienda · Muebles */
  .furn-item{ position:relative; }
  .furn-item .fi-tag{ position:absolute; top:9px; left:9px; }
  .furn-item .fi-art svg{ width:84px; height:64px; display:block; margin:0 auto; }
  .furn-item .si-visual{ height:68px; }
  .furn-item .fi-state{ display:block; margin:-2px 0 9px; font-size:11.5px; font-weight:700; color:var(--ink-dim); text-align:center; }
  .furn-item .btn-mini{ white-space:nowrap; padding:8px 10px; }
  .furn-item .si-have{ min-width:20px; text-align:center; padding:2px 6px; }
  .fv-preview{ display:flex; gap:22px; align-items:center; margin-bottom:22px; }
  .fv-mini{ flex:none; overflow:hidden; border-radius:18px; border:2px solid var(--line); position:relative; container-type:normal; --fb:100px; --wb:120px; --bw:300px; }
  .fv-mini .room-floor{ background:repeating-linear-gradient(90deg, var(--plank-1) 0 30px, var(--plank-2) 30px 60px); }
  .fv-mini .room-floor::after{ display:none; }
  .fv-art{ position:absolute; display:block; }
  .fv-art svg{ width:100%; height:100%; display:block; overflow:visible; }
  .fv-art.flat{ bottom:6% !important; }
  .fv-mini .fx-glow{ opacity:1; }
  .sk-trial .tb-furn{ padding:0; overflow:hidden; } .sk-trial .tb-furn .fv-mini{ border:0; border-radius:0; }

  /* ===== Fase 5 · BOCETOS: varios cuartos y Mito libre (propuesta; si se aprueba, pasa a style.css) ===== */
  /* paletas por cuarto: el Cuarto es el de siempre; los demás cambian pared, piso, cortinas y detalle de la pared */
  .room[data-room="bath"]{ --wall-1:#e2f5ff; --wall-2:#f3fbff; --dot:#c6eafc; --vignette:rgba(40,110,160,.10); --wall-ao:rgba(40,110,160,.10);
    --tile-1:#e3f6ff; --tile-2:#c7ebfb; --grout:#a9d9ef; --deco-1:#f8fdff; --deco-2:#d6f0fb; --deco-line:#a9d9ef;
    --frame:#fff; --frame-in:#e4f3fb; --frame-line:#a9d4ea; --frame-shadow:rgba(40,110,160,.14); --sky-2:#e6f4ff;
    --floor-near:rgba(30,90,130,.14); }
  .room[data-room="living"]{ --wall-1:#efe5ff; --wall-2:#f8f3ff; --dot:transparent; --vignette:rgba(110,60,170,.10); --wall-ao:rgba(110,60,170,.10);
    --plank-1:#f7e3c6; --plank-2:#efd4ad; --plank-3:#f3dbb9; --joint:#d8b384; --grain:rgba(160,110,50,.16); --bevel:rgba(255,255,255,.55); --floor-near:rgba(120,80,30,.14);
    --deco-1:#fbf8ff; --deco-2:#ece2ff; --deco-line:#cdb6f5; --stripe:rgba(185,138,246,.13);
    --cur-1:#c9a7ff; --cur-2:#e2d0ff; --cur-line:#8f6fd6; --frame-line:#d9c6f5; --frame-in:#f1e8fb; --frame-shadow:rgba(110,60,170,.14); }
  .room[data-room="kitchen"]{ --wall-1:#fff1d9; --wall-2:#fffaf0; --dot:#ffe1ad; --vignette:rgba(170,110,30,.10); --wall-ao:rgba(170,110,30,.10);
    --tile-1:#fff8ec; --tile-2:#ffd9a6; --grout:#efc790; --deco-1:#ffffff; --deco-2:#fff3e2; --deco-line:#f1cf9a;
    --cur-1:#ffd23c; --cur-2:#ffe68a; --cur-line:#e0a516; --tie:var(--pink); --tie-line:#d6478a;
    --frame-line:#f1d3a6; --frame-in:#fdf0dc; --frame-shadow:rgba(170,110,30,.14); --floor-near:rgba(150,90,20,.12); }
  [data-theme="dark"] .room[data-room="bath"]{ --wall-1:#1e2a40; --wall-2:#19233a; --dot:#26354f; --vignette:rgba(0,0,0,.38); --wall-ao:rgba(0,0,0,.28);
    --tile-1:#1f3247; --tile-2:#243a52; --grout:#142335; --deco-1:#24344c; --deco-2:#1f2d44; --deco-line:#162338;
    --frame:#33435c; --frame-in:#2b3a52; --frame-line:#475a78; --frame-shadow:rgba(0,0,0,.35); --sky-2:#3a3570; --floor-near:rgba(0,0,0,.25); }
  [data-theme="dark"] .room[data-room="living"]{ --wall-1:#2a2140; --wall-2:#231c36; --dot:transparent; --vignette:rgba(0,0,0,.38); --wall-ao:rgba(0,0,0,.28);
    --plank-1:#3b2f2c; --plank-2:#33292a; --plank-3:#3e322e; --joint:#1f1817; --grain:rgba(255,220,180,.06); --bevel:rgba(255,220,180,.06); --floor-near:rgba(0,0,0,.25);
    --deco-1:#30264a; --deco-2:#2a2142; --deco-line:#1c1530; --stripe:rgba(255,255,255,.035);
    --cur-1:#6c4fa3; --cur-2:#7e61b8; --cur-line:#4a3478; --frame-line:#55466e; --frame-in:#332947; --frame-shadow:rgba(0,0,0,.35); }
  [data-theme="dark"] .room[data-room="kitchen"]{ --wall-1:#33262e; --wall-2:#2b2029; --dot:#3f2f37; --vignette:rgba(0,0,0,.38); --wall-ao:rgba(0,0,0,.28);

  /* detalle de la pared: azulejo de cocina (franja baja), azulejo del baño (mitad baja), lambrín y rayas de la sala */

  .room[data-window="round"] .room-light{ display:none; }
