<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mito · Tienda nueva (solo dev)</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/style.css">
<style>
  body{ margin:0; }
  .panel{ background:var(--bg); color:var(--ink); padding:20px; }
  .panel h1{ font-size:20px; margin:0 0 4px; } .panel h2{ font-size:15px; margin:26px 0 10px; }
  .pair{ display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; }
  .lbl{ font-size:11px; font-weight:800; color:var(--ink-faint); margin:0 0 6px; text-transform:uppercase; letter-spacing:.04em; }

  /* ===== BOCETO: Tienda nueva (propuesta; si se aprueba, pasa a style.css) ===== */
  /* una pantalla: lo que se ve sin bajar */
  .s2-screen{ position:relative; overflow:hidden; border:2px solid var(--line); border-radius:18px; background:var(--bg); box-sizing:border-box; }
  .s2-scroll{ height:100%; overflow:hidden; padding:22px 28px 0; box-sizing:border-box; }
  .s2-screen.is-mobile .s2-scroll{ padding:14px 14px 0; }
  .s2-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .s2-head .page-title{ margin:0; font-size:30px; }
  .s2-head-r{ display:flex; align-items:center; gap:10px; }
  .is-mobile .s2-head .page-title{ font-size:24px; }
  .is-mobile .s2-head .btn-mini{ display:none; }   /* en el teléfono el Armario está en la Casa */
  /* lo fijo arriba: pestañas (+ vista previa compacta en escritorio) */
  .s2-sticky{ position:sticky; top:0; z-index:5; background:var(--bg); padding-bottom:10px; }
  .s2-tabs{ display:flex; gap:6px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding:3px 2px; }
  .s2-tabs::-webkit-scrollbar{ display:none; }
  .s2-tab{ all:unset; flex:0 0 auto; cursor:pointer; display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:999px; box-sizing:border-box;
    font:800 13.5px/1 var(--font-body); color:var(--ink-dim); background:var(--card); border:2px solid var(--line); }
  .s2-tab svg{ width:17px; height:17px; }
  .s2-tab[aria-selected="true"]{ color:#fff; border-color:transparent; background:linear-gradient(135deg,var(--pink),var(--lilac)); box-shadow:0 4px 0 0 #c4559a, var(--shadow-pink); }
  .is-mobile .s2-tab{ padding:8px 12px; font-size:12.5px; }
  /* vista previa compacta (escritorio): una sola fila, ~84 px */
  .s2-preview{ display:flex; align-items:center; gap:16px; margin-top:10px; padding:8px 16px 8px 8px; border-radius:18px;
    background:linear-gradient(150deg, var(--mint-pale), var(--card) 55%, var(--pink-pale)); border:2px dashed var(--mint); }
  [data-theme="dark"] .s2-preview{ background:linear-gradient(150deg,var(--mint-pale),#1a1424 55%,var(--pink-pale)); }
  .s2-pv-vis{ flex:none; width:108px; height:72px; display:grid; place-items:center; border-radius:14px; background:var(--card); border:2px solid var(--line); overflow:hidden; }
  .s2-pv-vis .mascot{ width:66px; height:66px; margin:0; animation:none; }
  .s2-pv-vis .mascot svg.pet{ width:58%; left:-36%; }
  .s2-pv-vis.room{ padding:0; } .s2-pv-vis .s2-mini{ width:100%; height:100%; border:0; border-radius:0; }
  .s2-pv-art svg{ width:56px; height:56px; display:block; }
  .s2-pv-text{ flex:1; display:grid; gap:3px; min-width:0; }
  .s2-pv-text b{ font:800 16px/1.2 var(--font-display); color:var(--ink); } .s2-pv-text span{ font-size:12.5px; font-weight:700; color:var(--ink-faint); }
  .s2-preview .btn-mini{ flex:none; padding:10px 18px; }
  /* herramientas de la sección */
  .s2-tools{ display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; margin:4px 0 12px; }
  .s2-tools h3{ margin:0 auto 0 0; font-size:18px; color:var(--ink); } .s2-tools h3 small{ font:700 12px/1 var(--font-body); color:var(--ink-faint); margin-left:6px; }
  .s2-sort{ display:flex; align-items:center; gap:4px; padding:3px; border-radius:999px; background:var(--card); border:2px solid var(--line); }
  .s2-sort span{ font:800 11px/1 var(--font-body); color:var(--ink-faint); padding:0 4px 0 8px; text-transform:uppercase; letter-spacing:.04em; }
  .s2-sort button{ all:unset; cursor:pointer; padding:6px 10px; border-radius:999px; font:800 12px/1 var(--font-body); color:var(--ink-dim); }
  .s2-sort button[aria-pressed="true"]{ background:var(--pink-pale); color:var(--pink-deep, #c2387f); }
  [data-theme="dark"] .s2-sort button[aria-pressed="true"]{ color:#ff9ac8; }
  .s2-afford{ display:inline-flex; align-items:center; gap:7px; font:800 12.5px/1 var(--font-body); color:var(--ink-dim); cursor:pointer; }
  .s2-afford input{ position:absolute; opacity:0; }
  .s2-afford i{ width:34px; height:20px; border-radius:999px; background:var(--line); position:relative; transition:background .2s; }
  .s2-afford i::after{ content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:translate .2s; }
  .s2-afford input:checked + i{ background:var(--mint); } .s2-afford input:checked + i::after{ translate:14px 0; }
  .is-mobile .s2-tools h3{ width:100%; font-size:16px; }
  .is-mobile .s2-tools .s2-sort{ display:none; }
  .s2-sort-m{ all:unset; display:none; cursor:pointer; padding:7px 12px; border-radius:999px; font:800 12.5px/1 var(--font-body); color:var(--ink); background:var(--card); border:2px solid var(--line); }
  .s2-sort-m b{ color:var(--ink-faint); margin-left:2px; }
  .is-mobile .s2-sort-m{ display:inline-block; }
  .is-mobile .s2-afford{ margin-left:auto; }
  .s2-screen .s2-tabs.can-right{ -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent); mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent); }
  .s2-screen .s2-tabs.can-left{ -webkit-mask-image:linear-gradient(90deg,transparent,#000 28px); mask-image:linear-gradient(90deg,transparent,#000 28px); }
  .s2-screen .s2-tabs.can-left.can-right{ -webkit-mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent); mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent); }
  /* tarjetas: mismo alto y orden (dibujo, nombre, precio, botón) */
  .s2-grid{ grid-template-columns:repeat(auto-fill, minmax(136px, 1fr)); }
  .is-mobile .s2-grid{ grid-template-columns:repeat(2, 1fr); gap:10px; }
  .s2-card{ position:relative; display:grid; grid-template-rows:72px 38px 20px auto; align-items:center; justify-items:center; gap:4px; padding:12px 10px; min-height:0; }
  .s2-visual{ height:72px; margin:0; } .s2-visual svg{ width:64px; height:64px; display:block; } .s2-visual.wide svg{ width:96px; height:66px; }
  .s2-name{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.2; font-size:13.5px; text-align:center; }
  .s2-price{ font:800 13px/1 var(--font-body); color:var(--ink); } .s2-price em{ font-style:normal; font-weight:700; color:var(--ink-faint); font-size:11.5px; }
  .s2-act .btn-mini{ white-space:nowrap; padding:8px 14px; }
  .s2-card .fi-tag{ position:absolute; top:9px; left:9px; font:800 9.5px/1 var(--font-body); letter-spacing:.04em; text-transform:uppercase; padding:2px 6px; border-radius:999px; }
  .s2-card .fi-tag.wall{ color:#5b3aa6; background:#e8dcff; } .s2-card .fi-tag.floor{ color:#0b6a4d; background:#c9f5e4; }
  [data-theme="dark"] .s2-card .fi-tag.wall{ color:#e4d4ff; background:#4a3a73; } [data-theme="dark"] .s2-card .fi-tag.floor{ color:#b9f5dd; background:#1d5a45; }
  .s2-card .si-have{ position:absolute; top:8px; right:8px; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:800; color:#04352a; background:var(--mint); }
  .furn-filter{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; }
  .ff-chip{ all:unset; cursor:pointer; padding:6px 13px; border-radius:999px; font:800 12.5px/1.2 var(--font-body); color:var(--ink-dim); background:var(--card); border:2px solid var(--line); }
  .ff-chip[aria-pressed="true"]{ color:#fff; border-color:transparent; background:linear-gradient(135deg, var(--pink), var(--lilac)); }
  .s2-mini.fv-mini{ position:relative; width:100%; height:100%; }
  /* sección completa */
  .s2-done{ display:flex; align-items:center; gap:18px; padding:22px 24px; border-radius:22px; border:2px dashed var(--mint); background:var(--mint-pale); }
  .s2-done .mascot{ width:84px; height:84px; margin:0; flex:none; animation:none; }
  .s2-done > div{ flex:1; display:grid; gap:4px; } .s2-done b{ font:800 18px/1.2 var(--font-display); color:var(--ink); } .s2-done span{ font-size:13.5px; font-weight:700; color:var(--ink-dim); }
  .is-mobile .s2-done{ flex-direction:column; text-align:center; }
  /* móvil: la barra de vista previa de siempre, sobre la barra de navegación */
  .s2-nav{ position:absolute; left:0; right:0; bottom:0; height:64px; display:grid; place-items:center; font:800 11px/1 var(--font-body); color:var(--ink-faint);
    background:var(--card); border-top:2px solid var(--line); text-transform:uppercase; letter-spacing:.05em; }
  .s2-trial{ position:absolute; left:12px; right:12px; bottom:74px; z-index:6; display:grid; grid-template-columns:120px minmax(0,1fr) auto; grid-template-areas:"mito text close" "mito act act";
    column-gap:12px; row-gap:6px; align-items:center; padding:10px; background:var(--card); border:2px solid var(--line); border-radius:24px; box-shadow:0 12px 28px -10px rgba(51,39,74,.38), var(--shadow-soft); }
  .s2-trial .tb-mito{ grid-area:mito; width:120px; height:92px; border-radius:20px; display:grid; place-items:center; overflow:hidden; box-sizing:border-box;
    background:linear-gradient(150deg, var(--mint-pale), var(--pink-pale)); border:2px solid var(--line); }
  .s2-trial .tb-mito .mascot{ width:76px; height:76px; margin:0; animation:none; }
  .s2-trial .tb-mito .mascot svg.pet{ width:58%; left:-36%; }
  .s2-trial .tb-mito.tb-room{ padding:0; } .s2-trial .s2-pv-art svg{ width:60px; height:60px; }
  .s2-trial .tb-text{ grid-area:text; display:grid; gap:2px; } .s2-trial .tb-name{ font-size:14px; font-weight:800; color:var(--ink); } .s2-trial .tb-sub{ font-size:11.5px; font-weight:700; color:var(--ink-faint); }
  .s2-trial .tb-act{ grid-area:act; justify-content:center; padding:10px 12px; font-size:13px; }
  .s2-trial .tb-close{ all:unset; grid-area:close; align-self:start; width:30px; height:30px; border-radius:999px; display:grid; place-items:center; font-size:22px; font-weight:900; color:var(--ink-faint); background:var(--pink-pale); border:2px solid var(--line); box-sizing:border-box; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">import { render } from './shop.js'; render(document.getElementById('root'));</script>
</body>
</html>
