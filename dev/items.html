<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mito · revisión de objetos (solo dev)</title>
<link rel="stylesheet" href="../src/style.css">
<style>
  body{margin:0;font-family:Nunito,system-ui,sans-serif}
  .panel{background:var(--bg);color:var(--ink,#222);padding:16px}
  .panel h1{font-size:18px;margin:0 0 12px}
  .panel h2{font-size:15px;margin:22px 0 8px}
  table{border-collapse:separate;border-spacing:4px}
  th{font-size:11px;font-weight:700;white-space:nowrap}
  th.row{text-align:right;padding-right:8px;min-width:110px}
  td{padding:0;background:var(--card);border-radius:10px}
  td .mascot{width:104px;height:104px;margin:0}
  .still .mascot,.still .mascot *{animation:none!important}
  .still .mascot .rig{animation:none!important}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./items.js"></script>
</body>
</html>
